version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./configs:/app/configs
    env_file:
      - .env
    environment:
      - STORAGE_PATH=/app/storage
      - CONFIG_PATH=/app/configs

  frontend:
    build:
      context: ./system/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
