<title id="title">Agent workflow</title><desc id="desc">Understand groups Vision, Planner and Script. Align groups Voice and Timeline. Produce groups Editing, Rendering and Evaluation. Timeline validates narration budgets before TTS and reconciles measured speech afterward.</desc>
