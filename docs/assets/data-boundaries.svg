<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">Data and credential boundaries</title><desc id="desc">Public code can be inspected. Private media and provider credentials remain in their own execution boundary.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d6b16c"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.line{fill:none;stroke:#d6b16c;stroke-width:1.5;marker-end:url(#arrow)}</style></defs><rect width="1160" height="620" rx="12" fill="#0d1825"/>
<text x="36" y="39" font-size="23" fill="#edf2f7">Data and credential boundaries</text>
<text x="36" y="67" font-size="13" fill="#9aafc2">Public code can be inspected. Private media and provider credentials remain in their own execution boundary.</text>
