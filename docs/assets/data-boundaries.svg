<rect x="56" y="326" width="266" height="130" rx="9" fill="#152333" stroke="#314457"/><rect x="56" y="339" width="3" height="25" rx="1.5" fill="#d6b16c"/><text x="76" y="356" font-size="17" fill="#edf2f7">Publication checks</text><text x="76" y="383" font-size="13" fill="#9aafc2">Working tree + Git history scan</text><text x="76" y="406" font-size="13" fill="#9aafc2">Secret-value comparison locally</text><text x="76" y="440" font-size="11" fill="#d6b16c">NO SECRETS IN SCAN OUTPUT</text>
<rect x="447" y="164" width="266" height="130" rx="9" fill="#152333" stroke="#314457"/><rect x="447" y="177" width="3" height="25" rx="1.5" fill="#7ac6aa"/><text x="467" y="194" font-size="17" fill="#edf2f7">Recorded presentation</text><text x="467" y="221" font-size="13" fill="#9aafc2">Previously rendered video</text><text x="467" y="244" font-size="13" fill="#9aafc2">Project and architecture diagrams</text><text x="467" y="278" font-size="11" fill="#7ac6aa">VIEWING ONLY · NO FILE INPUT</text>
