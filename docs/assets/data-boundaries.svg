<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480" role="img" aria-labelledby="title desc">
<title id="title">Data boundaries</title><desc id="desc">The public repository contains source code, diagrams and the recorded walkthrough. API credentials and private footage, logs and runtime workspaces stay in the private environment. Only the selected recording is published.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#d2af70"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="1160" height="480" rx="12" fill="#0b1b2b"/>
<path d="M56 32H88" fill="none" stroke="#d2af70" stroke-width="1.5"/>
<text x="1104" y="38" font-size="13" fill="#d2af70" text-anchor="end" font-weight="400">NESTO / 03</text>
<text x="56" y="78" font-size="32" fill="#f4f1ea" text-anchor="start" font-weight="500">Data boundaries</text>
<text x="56" y="111" font-size="17" fill="#abb9c6" text-anchor="start" font-weight="400">A clear separation between publication and private processing.</text>
<path d="M56 140H1104" fill="none" stroke="#2a3e52" stroke-width="1.5"/>
<rect x="56" y="180" width="480" height="188" rx="8" fill="#11263a" stroke="#2a3e52"/>
<text x="80" y="212" font-size="13" fill="#d2af70" text-anchor="start" font-weight="400">PUBLIC REPOSITORY</text>
<text x="80" y="258" font-size="25" fill="#f4f1ea" text-anchor="start" font-weight="500">Published</text>
<text x="80" y="299" font-size="18" fill="#abb9c6" text-anchor="start" font-weight="400">Source code + diagrams</text>
<text x="80" y="329" font-size="18" fill="#abb9c6" text-anchor="start" font-weight="400">Recorded walkthrough</text>
<rect x="624" y="180" width="480" height="188" rx="8" fill="#11263a" stroke="#2a3e52"/>
<text x="648" y="212" font-size="13" fill="#d2af70" text-anchor="start" font-weight="400">PRIVATE ENVIRONMENT</text>
<text x="648" y="258" font-size="25" fill="#f4f1ea" text-anchor="start" font-weight="500">Server only</text>
<text x="648" y="299" font-size="18" fill="#abb9c6" text-anchor="start" font-weight="400">API keys + credentials</text>
<text x="648" y="329" font-size="18" fill="#abb9c6" text-anchor="start" font-weight="400">Footage, logs + runtime files</text>
<path d="M580 196L580 352" fill="none" stroke="#2a3e52" stroke-width="1.5"/>
<path d="M56 416H1104" fill="none" stroke="#2a3e52" stroke-width="1.5"/>
<text x="56" y="449" font-size="16" fill="#abb9c6" text-anchor="start" font-weight="400">Only the selected recording is shared; provider credentials remain on the server.</text>
