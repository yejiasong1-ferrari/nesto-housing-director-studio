<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 610" role="img" aria-labelledby="title desc"><title id="title">System overview</title><desc id="desc">Three planes connect human intent, private computation and inspectable artifacts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d6b16c"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.line{fill:none;stroke:#d6b16c;stroke-width:1.5;marker-end:url(#arrow)}</style></defs><rect width="1160" height="610" rx="12" fill="#0d1825"/>
