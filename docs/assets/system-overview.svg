<rect x="36" y="128" width="330" height="168" rx="9" fill="#152333" stroke="#314457"/><rect x="36" y="141" width="3" height="25" rx="1.5" fill="#d6b16c"/><text x="56" y="158" font-size="17" fill="#edf2f7">Production Studio</text><text x="56" y="185" font-size="13" fill="#9aafc2">Import local video and a director brief</text><text x="56" y="208" font-size="13" fill="#9aafc2">Review scenes, narration and timing</text><text x="56" y="231" font-size="13" fill="#9aafc2">Edit, validate and export on-device</text><text x="56" y="280" font-size="11" fill="#d6b16c">PUBLIC WORKSPACE · NO PROVIDER KEYS</text>
<rect x="36" y="352" width="330" height="160" rx="9" fill="#152333" stroke="#314457"/><rect x="36" y="365" width="3" height="25" rx="1.5" fill="#7ac6aa"/><text x="56" y="382" font-size="17" fill="#edf2f7">Next.js private Studio</text><text x="56" y="409" font-size="13" fill="#9aafc2">Authenticated job creation</text><text x="56" y="432" font-size="13" fill="#9aafc2">Human review and script revisions</text><text x="56" y="455" font-size="13" fill="#9aafc2">Private media upload and preview</text><text x="56" y="496" font-size="11" fill="#7ac6aa">PRIVATE DEPLOYMENT</text>
