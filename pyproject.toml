[project]
name = "ai-director"
version = "1.0.0"
description = "Autonomous AI Director Agent for real estate video production"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "moviepy>=2.0.0,<3",
    "opencv-python>=4.8.0",
    "pillow>=10.3.0",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "open_clip_torch>=3.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "openai>=1.30.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "system"}

[tool.setuptools.packages.find]
where = ["system"]
include = ["backend*", "ai_director*"]

[tool.setuptools.package-data]
backend = ["prompts/**/*.md", "prompts/**/*.json", "static/**/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["system/backend", "system/tests"]
pythonpath = ["system"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
