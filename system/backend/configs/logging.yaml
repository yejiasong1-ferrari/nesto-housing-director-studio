# AI Director - Logging Configuration
# Version: 1.0.0

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s [%(levelname)s] %(name)s:%(lineno)d: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/ai_director.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/ai_director_error.log
    maxBytes: 10485760
    backupCount: 5

loggers:
  backend:
    level: INFO
    handlers: [console, file]
    propagate: false

  backend.agents:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  backend.core:
    level: INFO
    handlers: [console, file]
    propagate: false

  backend.services:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
